# Regenerate with: dart run flutter_native_splash:create --path flutter_native_splash.yaml
flutter_native_splash:
  # The gold launch surface: the Flutter splash takes over from this exact
  # colour and the centred 120 logical-px mark, with no native branding.
  color: "#E5C367"
  color_dark: "#E5C367"
  image: assets/branding/generated/cheetah_splash.png
  image_dark: assets/branding/generated/cheetah_splash.png
  android: true
  ios: true
  web: false
  # Android 12+ masks the icon to a circle of 2/3 the image; this image keeps
  # the rounded square inside it. Do not add icon_background_color: it
  # switches Android to a smaller canvas and circle.
  android_12:
    image: assets/branding/generated/cheetah_splash_android12.png
    image_dark: assets/branding/generated/cheetah_splash_android12.png
    color: "#E5C367"
    color_dark: "#E5C367"
