name: boctrust_savings_loan
description: BOCTrust savings and payments Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_secure_storage: ^10.0.0-beta.4
  flutter_local_notifications: ^19.5.0
  firebase_messaging: ^16.0.4
  shared_preferences: ^2.5.3
  flutter_riverpod: ^3.0.3
  pin_code_fields: ^8.0.1
  equatable: ^2.0.7
  intl: ^0.20.2
  dio: ^5.9.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/img/
    - assets/font/
    - assets/png/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/font/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/font/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/font/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/font/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/font/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/font/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/font/PlusJakartaSans-ExtraLight.ttf
          weight: 200
