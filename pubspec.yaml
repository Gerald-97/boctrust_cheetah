name: boctrust_savings_loan
description: Cheetah savings and payments Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_secure_storage: ^10.0.0-beta.4
  flutter_local_notifications: ^19.5.0
  webview_flutter_wkwebview: ^3.26.1
  permission_handler: ^12.0.3
  firebase_messaging: ^16.0.4
  shared_preferences: ^2.5.3
  flutter_riverpod: ^3.0.3
  webview_flutter: ^4.14.1
  pin_code_fields: ^8.0.1
  firebase_core: ^4.13.0
  fluttertoast: ^10.0.0
  file_picker: ^10.3.4
  smile_id: ^11.2.12
  equatable: ^2.0.7
  logger: ^2.7.0
  intl: ^0.20.2
  dio: ^5.9.0
  flutter_svg: ^2.3.0


  dojah_kyc_sdk_flutter:
    path: packages/dojah_kyc_sdk_flutter
  local_auth: ^3.0.2

dev_dependencies:
  crypto: ^3.0.6
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  image: ^4.5.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/cheetah_app_icon.svg
    - assets/svg/
    - assets/img/
    - assets/font/
    - assets/png/
    - assets/json/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/font/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/font/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/font/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/font/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/font/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/font/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/font/PlusJakartaSans-ExtraLight.ttf
          weight: 200
    - family: FHOscar
      fonts:
        - asset: assets/font/FHOscarTest-Black.otf
          weight: 900
        - asset: assets/font/FHOscarTest-Bold.otf
          weight: 700
        - asset: assets/font/FHOscarTest-SemiBold.otf
          weight: 600
        - asset: assets/font/FHOscarTest-Medium.otf
          weight: 500
        - asset: assets/font/FHOscarTest-Regular.otf
          weight: 400
        - asset: assets/font/FHOscarTest-Light.otf
          weight: 300
