name: Flutter quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib
      - run: flutter analyze

      # Automated tests will be added when the prototype behavior is stable.

  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true
      - run: xcodebuild -version
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - run: flutter build ios --release --no-codesign
      - name: Verify CocoaPods was not recreated
        run: |
          test ! -e ios/Podfile
          test ! -e ios/Podfile.lock
          test ! -d ios/Pods
