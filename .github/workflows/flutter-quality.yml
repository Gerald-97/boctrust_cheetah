name: Flutter quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.6'
          cache: true
      - run: xcodebuild -version
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - run: flutter build ios --release --no-codesign
      # iOS is SwiftPM-only. Dojah runs natively on Android and through an
      # embedded WebView on iOS, so its native iOS plugin must stay unlinked.
      - name: Verify CocoaPods and native iOS Dojah were not recreated
        run: |
          test ! -e ios/Podfile
          test ! -e ios/Podfile.lock
          test ! -d ios/Pods
          test ! -e .gitmodules
          ! grep -qi dojah ios/Runner/GeneratedPluginRegistrant.m
